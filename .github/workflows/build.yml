name: Build c4z

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua (syntax validation)
        run: sudo apt-get install -y lua5.3 && sudo ln -sf /usr/bin/luac5.3 /usr/local/bin/luac

      - name: Concatenate source files
        run: |
          # ── Root driver ──────────────────────────────────────────────────
          {
            echo '-- Room Control Webhook Driver'
            echo '-- AUTO-GENERATED by build.sh — edit driver/src/ or shared/ instead.'
            echo '---@diagnostic disable: undefined-global'
            while IFS= read -r f; do echo; cat "$f"; done < <(
              ls driver/src/*.lua shared/*.lua | awk -F/ '{print $NF, $0}' | sort | cut -d' ' -f2-
            )
          } > driver/driver.lua
          echo "Built driver/driver.lua ($(wc -l < driver/driver.lua) lines)"

          # ── Room child driver ─────────────────────────────────────────────
          {
            echo '-- Room Control Webhook Room Driver'
            echo '-- AUTO-GENERATED by build.sh — edit room/src/ or shared/ instead.'
            echo '---@diagnostic disable: undefined-global'
            while IFS= read -r f; do echo; cat "$f"; done < <(
              ls room/src/*.lua shared/*.lua | awk -F/ '{print $NF, $0}' | sort | cut -d' ' -f2-
            )
          } > room/driver.lua
          echo "Built room/driver.lua ($(wc -l < room/driver.lua) lines)"

      - name: Validate Lua syntax
        run: |
          luac -p driver/driver.lua && echo "OK  driver/driver.lua"
          luac -p room/driver.lua   && echo "OK  room/driver.lua"

      - name: Stamp driver.xml files
        run: |
          BUILD_DATE=$(date +"%m/%d/%Y %H:%M")
          VERSION=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          sed -i "s|<modified>.*</modified>|<modified>${BUILD_DATE}</modified>|" driver/driver.xml
          sed -i "s|<version>[^<]*</version>|<version>${VERSION}</version>|" driver/driver.xml
          sed -i "s|<modified>.*</modified>|<modified>${BUILD_DATE}</modified>|" room/driver.xml
          sed -i "s|<version>[^<]*</version>|<version>${VERSION}</version>|" room/driver.xml
          echo "version=${VERSION}  modified=${BUILD_DATE}"

      - name: Package root driver (room_control_webhook.c4z)
        uses: snap-one/drivers-driverpackager@v2-rc4
        with:
          projectDir: './driver'
          c4zproj: 'room_control_webhook.c4zproj'
          outputDir: '.'

      - name: Package room child driver (room_control_webhook_room.c4z)
        uses: snap-one/drivers-driverpackager@v2-rc4
        with:
          projectDir: './room'
          c4zproj: 'room_control_webhook_room.c4zproj'
          outputDir: '.'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: room_control_webhook
          path: |
            room_control_webhook.c4z
            room_control_webhook_room.c4z

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" room_control_webhook.c4z --clobber
          gh release upload "${{ github.event.release.tag_name }}" room_control_webhook_room.c4z --clobber
