name: Build c4z

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Concatenate source files
        run: |
          {
            echo '-- Room Control Webhook Driver'
            echo '-- AUTO-GENERATED by build.sh — edit files in src/ instead.'
            echo '---@diagnostic disable: undefined-global'
            for f in src/*.lua; do echo; cat "$f"; done
          } > driver.lua
          echo "Built driver.lua ($(wc -l < driver.lua) lines)"

      - name: Stamp driver.xml
        run: |
          BUILD_DATE=$(date +"%m/%d/%Y %H:%M")
          VERSION=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          sed -i "s|<modified>.*</modified>|<modified>${BUILD_DATE}</modified>|" driver.xml
          sed -i "s|<version>[^<]*</version>|<version>${VERSION}</version>|" driver.xml
          echo "version=${VERSION}  modified=${BUILD_DATE}"

      - name: Build c4z
        uses: snap-one/drivers-driverpackager@v2-rc4
        with:
          projectDir: '.'
          c4zproj: 'room_control_webhook.c4zproj'
          outputDir: '.'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: room_control_webhook
          path: room_control_webhook.c4z
